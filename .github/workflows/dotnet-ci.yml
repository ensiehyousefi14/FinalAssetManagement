name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Format code
        run: dotnet format --no-restore

      - name: Commit and push formatted changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing and pushing..."
            git add .
            git commit -m "style: auto-format code with dotnet format"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "No formatting changes needed."
          fi

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish project
        run: dotnet publish ./FinalAssetManagement.WebAPI/FinalAssetManagement.WebAPI.csproj --no-build --configuration Release -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: publish

  deploy:
    needs: build-test-publish
    runs-on: self-hosted
    if: github.ref == 'refs/heads/MainBranch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: publish

      - name: Stop IIS AppPool
        run: Stop-WebAppPool -Name "FinalAssetManagement"
        shell: powershell

      - name: Clean IIS folder
        run: Remove-Item -Path "E:\_Publish\FinalAssetManagement\*" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell

      - name: Copy new build to IIS
        run: Copy-Item -Path ".\publish\*" -Destination "E:\_Publish\FinalAssetManagement" -Recurse -Force
        shell: powershell

      - name: Start IIS AppPool
        run: Start-WebAppPool -Name "FinalAssetManagement"
        shell: powershell
